<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React Profile - JSX Practice</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 2rem; background:#f7f7f7 }
      .profile { background: #fff; padding: 1.5rem; border-radius:8px; max-width:480px; box-shadow:0 2px 8px rgba(0,0,0,0.06) }
      h1 { margin:0 0 .25rem }
      h2 { margin:0 0 .75rem; color:#666; font-weight:500 }
      ul { margin:0.5rem 0 1rem; padding-left:1.25rem }
    </style>
    <!-- React and ReactDOM UMD builds -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for in-browser JSX transpilation (for learning/demo only) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Load the JSX script (type text/babel so Babel transpiles it) -->
    <script type="text/babel" src="script.js"></script>
  </body>
</html>
